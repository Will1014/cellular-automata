[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellular-automata"
version = "0.1.0"
description = "Generate, play back, measure and evolve 1D cellular automaton rules."
readme = "README.md"
license = "MIT"
authors = [{ name = "Will Armstrong" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
